# Tabbly's scan server. Deploy: `npm run deploy`.
# The Anthropic key is a secret, never in this file:
#   npx wrangler secret put ANTHROPIC_API_KEY
name = "split-it-scan"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Served at https://split-it-scan.<account>.workers.dev; no per-version preview
# URLs, so there's only ever one public copy of the server.
workers_dev = true
preview_urls = false

# Limits. A phone's allowance is weekly (resets Monday 00:00 UTC); the two
# backstops are per UTC day. Raise these as the app grows.
[vars]
PER_DEVICE_WEEKLY = "10"  # scans per phone per week
PER_IP_DAILY = "40"       # scans per internet connection (backstop for faked install ids)
GLOBAL_DAILY = "300"      # scans across everyone — the hard ceiling on spend
MAX_IMAGE_BYTES = "4000000"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]
